<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Iskali Barbería</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main style="max-width:360px; padding-top:60px;">
  <div style="text-align:center; margin-bottom:20px;">
    <img src="img/logo.png" alt="Iskali Barbería" style="height:56px;">
  </div>
  <section class="card">
    <h2>Entrar al panel</h2>
    <label for="user">Usuario</label>
    <input type="text" id="user" autocomplete="username">
    <label for="pass">Contraseña</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button id="loginBtn" style="margin-top:18px;">Entrar</button>
    <p id="loginError" class="error" hidden></p>
  </section>
</main>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
